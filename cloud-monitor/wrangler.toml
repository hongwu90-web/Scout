name = "scout-cloud-monitor"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 24/7 Autonomous Cron Trigger (every 5 minutes)
[triggers]
crons = ["*/5 * * * *"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "scout-monitor-db"
database_id = "your-d1-database-id-here"
